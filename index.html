/* Layout: enterprise look — deep navy sidebar, white work surface, one brand accent, status colours only where they carry meaning; phones get a bottom tab bar and full-screen sheets. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --surface-2: #f7f9fb; --surface-3: #eef1f5; --line: #e1e6ed; --line-2: #edf0f4;
  --ink: #111827; --ink-2: #374151; --muted: #667085; --faint: #98a2b3;
  --accent: #1f4fd1; --accent-2: #1a3fa8; --accent-soft: #eaf0fd; --accent-ink: #ffffff; --pink: #1f4fd1;
  --saffron: #b7791f; --saffron-soft: #fbf3e3; --gold: #b7791f;
  --nav-bg: #0f1b2d; --nav-bg-2: rgba(255,255,255,.07); --nav-ink: #c6d0de; --nav-muted: #7d8ca3; --nav-active: #ffffff; --nav-hi: #5b8cff;
  --red: #c62828; --red-soft: #fdecec; --amber: #b45309; --amber-soft: #fdf3e4; --green: #12795b; --green-soft: #e5f4ee;
  --blue: #1f4fd1; --blue-soft: #eaf0fd; --violet: #5b4bb7; --violet-soft: #efedfa; --cyan: #0e7490; --cyan-soft: #e2f3f6; --slate: #556074; --slate-soft: #eef1f5;
  --c1: #1f4fd1; --c2: #86a8f2; --c3: #0e7490; --c4: #94a3b8; --c5: #12795b; --c6: #b45309; --c7: #5b4bb7; --c8: #334155;
  --m-dash: var(--accent); --m-cli: var(--accent); --m-key: var(--accent); --m-inv: var(--accent); --m-rcpt: var(--accent); --m-recv: var(--accent); --m-comp: var(--accent); --m-staff: var(--accent); --m-docs: var(--accent); --m-rep: var(--accent); --m-ai: var(--accent); --m-io: var(--accent); --m-adm: var(--accent);
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 20px 48px rgba(15, 23, 42, .22);
  --scrim: rgba(15, 23, 42, .45);
  --f-display: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 8px; --r-sm: 6px; --r-lg: 10px;
  --side: 248px; --top: 60px; --tab: 66px;
}

  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.25); --shadow-lg: 0 20px 50px rgba(0,0,0,.55); --scrim: rgba(0,0,0,.6);
  color-scheme: dark; } }

  --c1: #6d93f5; --c2: #3e5fae; --c3: #4cc3d9; --c4: #7d8ca3; --c5: #4cc79a; --c6: #f0a04b; --c7: #a99cf0; --c8: #c3cddb;

  color-scheme: dark; }

* { box-sizing: border-box; }
svg { width: 18px; height: 18px; flex: none; }
.banner > svg { margin-top: 1px; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .92em; letter-spacing: .01em; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.nowrap { white-space: nowrap; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.6rem; font-weight: 700; } h2 { font-size: 1.15rem; font-weight: 650; } h3 { font-size: 1rem; font-weight: 650; }
.eyebrow { font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 650; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; background: var(--nav-bg); color: var(--nav-ink); display: flex; flex-direction: column; overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px); }
.brand { display: flex; gap: 10px; align-items: center; padding: 16px 16px 14px; border-bottom: 1px solid var(--nav-bg-2); }
.brand-mark { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--saffron)); display: grid; place-items: center; color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 15px; flex: none; overflow: hidden; }
.brand-mark img { width: 100%; height: 100%; object-fit: cover; }
.brand-name { font-family: var(--f-display); font-weight: 700; color: var(--nav-active); font-size: 15px; line-height: 1.15; }
.brand-sub { font-size: 11px; color: var(--nav-muted); }
.nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 1px; }
.nav-sec { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--nav-muted); padding: 14px 10px 5px; font-weight: 650; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; color: var(--nav-ink); text-decoration: none; border-radius: 8px; font-weight: 500; min-height: 38px; }
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav a:hover { background: var(--nav-bg-2); color: var(--nav-active); }
.nav a.on { background: var(--nav-bg-2); color: var(--nav-active); box-shadow: inset 3px 0 0 var(--saffron); }
.nav .cnt { margin-left: auto; font-size: 11px; background: var(--red); color: #fff; border-radius: 9px; padding: 0 6px; min-width: 18px; text-align: center; font-weight: 700; }
.side-foot { margin-top: auto; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--nav-bg-2); font-size: 12px; color: var(--nav-muted); display: grid; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--faint); }
.dot.ok { background: #3fcf8e; } .dot.warn { background: #f5b14a; } .dot.bad { background: #f07167; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); height: var(--top); display: flex; align-items: center; gap: 10px; padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.search { flex: 1; max-width: 520px; position: relative; }
.search input { width: 100%; height: 38px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 0 12px 0 34px; font-size: 14px; }
.search svg { position: absolute; left: 10px; top: 10px; width: 18px; height: 18px; color: var(--muted); }
.search-res { position: absolute; top: 44px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-lg); max-height: 60vh; overflow: auto; z-index: 40; }
.search-res button { display: flex; width: 100%; text-align: left; gap: 10px; padding: 9px 12px; border: 0; background: none; cursor: pointer; align-items: center; }
.search-res button:hover, .search-res button.hl { background: var(--surface-2); }
.top-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.icon-btn { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; position: relative; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn .badge-n { position: absolute; top: -5px; right: -5px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; border-radius: 9px; padding: 0 5px; line-height: 16px; min-width: 16px; text-align: center; }
.fy-sel { height: 38px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 0 8px; font-weight: 600; }
.me { display: flex; align-items: center; gap: 8px; padding: 3px 8px 3px 3px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); cursor: pointer; }
.me img { width: 30px; height: 30px; border-radius: 50%; }
.me span { font-size: 12.5px; font-weight: 600; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.content { padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); width: 100%; max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--r); border: 1px solid; font-size: 13px; }
.banner.warn { background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 35%, transparent); color: var(--ink); }
.banner.info { background: var(--blue-soft); border-color: color-mix(in srgb, var(--blue) 30%, transparent); }
.banner.bad { background: var(--red-soft); border-color: color-mix(in srgb, var(--red) 35%, transparent); }
.banner.ok { background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 30%, transparent); }
.banner b { font-weight: 700; }

.page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-head .t { display: grid; gap: 2px; min-width: 0; }
.page-head .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn svg { width: 16px; height: 16px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.warn { background: var(--saffron); border-color: var(--saffron); color: #fff; }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
.btn.danger.solid { background: var(--red); color: #fff; border-color: var(--red); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn.xs { height: 26px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 0 12px; height: 34px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent-2); }
:root[data-theme="dark"] .seg button.on { color: var(--accent); }
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .lbl { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: 11.5px; color: var(--muted); }
.field .err { font-size: 11.5px; color: var(--red); font-weight: 600; }
.field .wrn { font-size: 11.5px; color: var(--amber); font-weight: 600; }
.inp, select.inp, textarea.inp { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 10px; font-size: 14px; min-width: 0; }
textarea.inp { height: auto; min-height: 76px; padding: 8px 10px; resize: vertical; }
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.inp.bad { border-color: var(--red); }
.inp.r { text-align: right; font-variant-numeric: tabular-nums; }
.inp.mono { font-family: var(--f-mono); text-transform: uppercase; }
.chk { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13.5px; min-height: 30px; }
.chk input { width: 17px; height: 17px; accent-color: var(--accent); }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; } .span-all { grid-column: 1 / -1; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters .inp, .filters select { width: auto; min-width: 130px; height: 34px; font-size: 13px; }
.filters .grow { flex: 1; min-width: 180px; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.card.pad { padding: 16px; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; flex-wrap: wrap; }
.card-h .r { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.card-b { padding: 0 16px 16px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 13px 14px 12px; display: grid; gap: 4px; text-align: left; cursor: pointer; position: relative; overflow: hidden; color: var(--ink); }
.kpi:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.kpi .k-lbl { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.kpi .k-lbl i { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }
.kpi .k-val { font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.15; }
.kpi .k-sub { font-size: 12px; color: var(--muted); }
.kpi .k-sub b { color: var(--ink-2); }
.kpi.red .k-val { color: var(--red); } .kpi.amber .k-val { color: var(--amber); } .kpi.green .k-val { color: var(--green); }
.dash-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; } .c5 { grid-column: span 5; } .c4 { grid-column: span 4; }
details.card > summary { list-style: none; cursor: pointer; }
details.card > summary::-webkit-details-marker { display: none; }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 20px; font-size: 11.5px; font-weight: 650; white-space: nowrap; line-height: 20px; background: var(--slate-soft); color: var(--slate); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
.badge.plain::before { display: none; }
.t-red { background: var(--red-soft); color: var(--red); } .t-amber { background: var(--amber-soft); color: var(--amber); } .t-green { background: var(--green-soft); color: var(--green); }
.t-blue { background: var(--blue-soft); color: var(--blue); } .t-violet { background: var(--violet-soft); color: var(--violet); } .t-cyan { background: var(--cyan-soft); color: var(--cyan); }
.t-slate { background: var(--slate-soft); color: var(--slate); } .t-accent { background: var(--accent-soft); color: var(--accent-2); } .t-saffron { background: var(--saffron-soft); color: var(--saffron); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.chip:hover { border-color: var(--accent); color: var(--accent-2); }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; background: var(--surface-2); font-size: 11.5px; color: var(--ink-2); border: 1px solid var(--line-2); }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-top: 1px solid var(--line-2); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; padding: 9px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
.tbl th.sortable { cursor: pointer; } .tbl th.sortable:hover { color: var(--ink); }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.tbl td.n, .tbl th.n { text-align: right; white-space: nowrap; }
.tbl tfoot td { font-weight: 700; background: var(--surface-2); border-top: 1px solid var(--line); }
.tbl .sel { width: 34px; }
.tbl td .sub { font-size: 12px; color: var(--muted); }
.tbl.compact td, .tbl.compact th { padding: 6px 8px; }
.tbl tr.dim td { opacity: .55; }
.tbl .strong { font-weight: 650; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 10px 16px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.empty { padding: 34px 20px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 42px; height: 42px; color: var(--faint); }
.empty h3 { color: var(--ink); }

/* ---------- progress / charts ---------- */
.bar { height: 8px; background: var(--surface-3); border-radius: 6px; overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.prog-row { display: grid; grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) 56px; gap: 10px; align-items: center; font-size: 13px; padding: 5px 0; cursor: pointer; border-radius: 6px; }
.prog-row:hover { background: var(--surface-2); }
.prog-row .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .gl { stroke: var(--line-2); stroke-width: 1; }
.chart .ax { stroke: var(--line); }
.chart rect.hit { fill: transparent; cursor: pointer; }
.chart rect.hit:hover { fill: color-mix(in srgb, var(--accent) 8%, transparent); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.donut-wrap { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; align-items: center; }
.donut-leg { display: grid; gap: 4px; font-size: 13px; }
.donut-leg button { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer; text-align: left; }
.donut-leg button:hover { background: var(--surface-2); }
.donut-leg i { width: 10px; height: 10px; border-radius: 3px; }
.age-bars { display: grid; gap: 6px; }
.alert-list { display: grid; }
.alert { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line-2); align-items: center; cursor: pointer; border-radius: 6px; }
.alert:hover { background: var(--surface-2); }
.alert .stripe { align-self: stretch; border-radius: 4px; background: var(--slate); }
.alert .stripe.red { background: var(--red); } .alert .stripe.amber { background: var(--amber); } .alert .stripe.blue { background: var(--blue); } .alert .stripe.violet { background: var(--violet); } .alert .stripe.green { background: var(--green); }
.alert .a-t { font-weight: 600; font-size: 13px; } .alert .a-s { font-size: 12px; color: var(--muted); }

/* ---------- kanban / calendar / matrix ---------- */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
.kcol { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; max-height: 72vh; min-width: 0; }
.kcol-h { padding: 10px 12px; display: flex; align-items: center; gap: 8px; font-weight: 650; border-bottom: 1px solid var(--line); }
.kcol-b { padding: 8px; display: grid; gap: 8px; overflow-y: auto; align-content: start; min-height: 80px; }
.kcol-b.drop { background: var(--accent-soft); }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; display: grid; gap: 4px; cursor: grab; border-left: 4px solid var(--slate); }
.kcard.red { border-left-color: var(--red); } .kcard.amber { border-left-color: var(--amber); } .kcard.blue { border-left-color: var(--blue); } .kcard.green { border-left-color: var(--green); }
.kcard .kt { font-weight: 650; font-size: 13px; } .kcard .ks { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--line); gap: 1px; }
.cal .dow { background: var(--surface-2); padding: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); text-align: center; }
.cal .day { background: var(--surface); min-height: 104px; padding: 5px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal .day.out { background: var(--surface-2); opacity: .6; }
.cal .day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal .dn { font-size: 12px; font-weight: 700; color: var(--muted); }
.cal .ev { font-size: 11px; padding: 1px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-weight: 600; }
.matrix td.mx { text-align: center; padding: 4px; }
.mxc { display: inline-grid; place-items: center; min-width: 34px; height: 26px; border-radius: 6px; font-size: 11.5px; font-weight: 700; cursor: pointer; }

/* ---------- drawer / modal ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 80; display: flex; justify-content: flex-end; animation: fade .15s ease-out; }
.drawer { background: var(--bg); width: min(980px, 100%); height: 100%; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: slide .2s ease-out; padding-top: env(safe-area-inset-top, 0px); }
.drawer.narrow { width: min(560px, 100%); }
.drawer-h { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
.drawer-h h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-b { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch; min-height: 0; }
.drawer-b > * { flex-shrink: 0; }
.modal-b > * { flex-shrink: 0; }
.drawer-f { flex: none; display: flex; gap: 8px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.drawer-f .sp { flex: 1; }
.modal-c { position: fixed; inset: 0; z-index: 230; display: grid; place-items: center; padding: 16px; background: var(--scrim); animation: fade .12s ease-out; }
.modal { background: var(--surface); border-radius: var(--r-lg); width: min(520px, 100%); box-shadow: var(--shadow-lg); max-height: 90vh; display: flex; flex-direction: column; }
.modal.wide { width: min(820px, 100%); }
.modal-b { padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.modal-f { padding: 12px 18px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--line); flex-wrap: wrap; }
.sect { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; min-width: 0; }
.sect > h3 { display: flex; align-items: center; gap: 8px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; -webkit-overflow-scrolling: touch; flex: none; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 650; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; font-size: 13.5px; }
.tabs button.on { color: var(--accent-2); border-bottom-color: var(--accent); }
:root[data-theme="dark"] .tabs button.on { color: var(--accent); }
.kv { display: grid; grid-template-columns: minmax(110px, 38%) minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 550; overflow-wrap: anywhere; }
.totals { display: grid; gap: 4px; justify-self: end; min-width: min(320px, 100%); font-size: 13.5px; }
.totals div { display: flex; justify-content: space-between; gap: 20px; font-variant-numeric: tabular-nums; }
.totals .grand { font-size: 1.15rem; font-weight: 750; border-top: 1px solid var(--line); padding-top: 6px; font-family: var(--f-display); }
.line-items { display: grid; gap: 8px; }
.li-row { display: grid; grid-template-columns: minmax(150px, 1.6fr) 110px 70px 120px 110px 80px 34px; gap: 6px; align-items: start; }
.li-row.h { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; }
.toast-c { position: fixed; z-index: 300; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); display: grid; gap: 8px; width: min(440px, calc(100% - 32px)); }
.toast { background: var(--ink); color: var(--surface); padding: 11px 14px; border-radius: 10px; box-shadow: var(--shadow-lg); font-weight: 600; font-size: 13.5px; display: flex; gap: 10px; align-items: center; animation: pop .18s ease-out; }
.toast.bad { background: var(--red); color: #fff; }
.pop { position: absolute; right: 0; top: 46px; width: min(400px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); z-index: 45; max-height: 70vh; display: flex; flex-direction: column; }
.pop-h { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.pop-b { overflow-y: auto; padding: 4px 8px 8px; }
.qa-menu { display: grid; padding: 6px; }
.qa-menu button { display: flex; gap: 10px; align-items: center; border: 0; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; text-align: left; font-weight: 600; min-height: 40px; }
.qa-menu button:hover { background: var(--surface-2); }
.qa-menu svg { width: 17px; height: 17px; color: var(--accent); }
.lock { position: fixed; inset: 0; z-index: 240; background: var(--nav-bg); color: var(--nav-ink); display: grid; place-items: center; text-align: center; padding: 20px; }
.lock h2 { color: #fff; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps span { padding: 4px 10px; border-radius: 20px; background: var(--surface-2); font-size: 12px; font-weight: 650; color: var(--muted); }
.steps span.on { background: var(--accent); color: var(--accent-ink); }
.steps span.done { background: var(--accent-soft); color: var(--accent-2); }
.chat { display: grid; gap: 12px; }
.msg { max-width: 86%; padding: 11px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.55; }
.msg.u { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.a { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.a .meta { font-size: 11.5px; color: var(--muted); margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.msg table { border-collapse: collapse; margin: 6px 0; font-size: 12.5px; white-space: normal; }
.msg td, .msg th { border: 1px solid var(--line); padding: 3px 6px; }
.dropzone { border: 2px dashed var(--line); border-radius: var(--r-lg); padding: 26px; text-align: center; display: grid; gap: 8px; justify-items: center; background: var(--surface); cursor: pointer; }
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.sw.on { box-shadow: 0 0 0 2px var(--ink); }
.list-plain { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; padding-bottom: 12px; position: relative; }
.tl::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 0; width: 2px; background: var(--line); }
.tl:last-child::before { display: none; }
.tl i { width: 14px; height: 14px; border-radius: 50%; background: var(--accent-soft); border: 2px solid var(--accent); margin-top: 2px; }
.tl .tt { font-size: 12px; color: var(--muted); }
.hide-sm { } .show-sm { display: none !important; }
.tabbar { display: none; }

@keyframes fade { from { opacity: 0; } } @keyframes slide { from { transform: translateX(40px); opacity: .6; } } @keyframes pop { from { transform: translateY(8px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

@media (max-width: 1180px) { .c8, .c7, .c6, .c5, .c4 { grid-column: span 12; } .split { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 1100px) and (min-width: 821px) { .c6, .c4 { grid-column: span 6; } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .side.open { display: flex; position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 95; box-shadow: var(--shadow-lg); }
  .hide-sm { display: none !important; } .show-sm { display: inline-flex !important; }
  .top { gap: 6px; }
  .search { max-width: none; }
  .fy-sel { max-width: 92px; }
  .content { padding-block: 14px calc(var(--tab) + 28px + env(safe-area-inset-bottom, 0px)); gap: 14px; }
  .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); } .span2 { grid-column: auto; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi .k-val { font-size: 1.2rem; }
  h1 { font-size: 1.3rem; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tabbar a, .tabbar button { display: grid; justify-items: center; gap: 2px; padding: 8px 2px 6px; font-size: 10.5px; font-weight: 650; color: var(--muted); text-decoration: none; border: 0; background: none; min-height: 52px; }
  .tabbar svg { width: 22px; height: 22px; }
  .tabbar .on { color: var(--accent); }
  .inp, select.inp, textarea.inp, .search input, .filters .inp, .filters select { font-size: 16px; height: 44px; }
  .btn { height: 42px; } .btn.sm { height: 36px; } .btn.xs { height: 32px; }
  .icon-btn { width: 40px; height: 40px; }
  .drawer, .drawer.narrow { width: 100%; }
  .drawer-b { padding: 14px; }
  .li-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); padding: 10px; border-radius: 10px; }
  .li-row > :first-child { grid-column: 1 / -1; }
  .li-row.h { display: none; }
  .donut-wrap { grid-template-columns: 110px minmax(0, 1fr); }
  .toast-c { bottom: calc(var(--tab) + 16px + env(safe-area-inset-bottom, 0px)); }
  .msg { max-width: 94%; }
  .kanban { grid-auto-columns: minmax(78vw, 1fr); scroll-snap-type: x mandatory; } .kcol { scroll-snap-align: start; }
  .cal .day { min-height: 64px; } .cal .ev { font-size: 9.5px; padding: 0 3px; }
  .me span { display: none; }
  .page-head .acts { margin-left: 0; width: 100%; }
}

/* ---------- first-run setup (installable app) ---------- */
.setup { position: fixed; inset: 0; z-index: 150; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: max(24px, env(safe-area-inset-top, 0px)); padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.su-box { max-width: 640px; margin: 0 auto; display: grid; gap: 16px; }
.su-list { display: grid; gap: 10px; }
.su-card { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; text-align: left; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); cursor: pointer; color: var(--ink); align-items: start; }
.su-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.su-card[disabled] { opacity: .5; cursor: not-allowed; }
.su-card > svg { width: 40px; height: 40px; padding: 8px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-2); }
.su-card b { display: block; font-size: 15px; margin-bottom: 3px; font-family: var(--f-display); }
.su-card .muted { display: block; font-size: 13px; }
.lock .inp { color: var(--ink); }


/* ---------- enterprise skin ---------- */
body { background: var(--bg); font-size: 14px; letter-spacing: -.003em; }
h1, h2, h3, h4 { font-family: var(--f-display); letter-spacing: -.015em; color: var(--ink); }
h1 { font-size: 1.45rem; font-weight: 650; } h2 { font-size: 1rem; font-weight: 600; } h3 { font-size: .95rem; font-weight: 600; }
.eyebrow { font-weight: 600; letter-spacing: .06em; font-size: .68rem; }
/* sidebar */
.side { background: var(--nav-bg); border-right: 1px solid rgba(255,255,255,.04); }
.brand { border-bottom: 1px solid rgba(255,255,255,.06); padding: 16px 16px 14px; }
.brand-mark { background: var(--nav-hi); color: #fff; border-radius: 8px; width: 34px; height: 34px; font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.brand-name { font-weight: 650; font-size: 14.5px; letter-spacing: -.01em; }
.nav { gap: 1px; padding: 8px 10px; }
.nav-sec { color: var(--nav-muted); font-weight: 600; letter-spacing: .09em; font-size: 10.5px; padding: 16px 10px 6px; }
.nav a { gap: 10px; border-radius: 6px; padding: 7px 10px; min-height: 36px; font-weight: 500; font-size: 13.5px; color: var(--nav-ink); transition: background .12s, color .12s; }
.nav a:hover { background: var(--nav-bg-2); color: #fff; }
.nav .nav-ic { width: 20px; height: 20px; display: grid; place-items: center; color: var(--nav-muted); flex: none; }
.nav .nav-ic svg { width: 17px; height: 17px; opacity: 1; }
.nav a:hover .nav-ic { color: #fff; }
.nav a.on { background: rgba(91, 140, 255, .14); color: #fff; box-shadow: inset 3px 0 0 var(--nav-hi); font-weight: 600; }
.nav a.on .nav-ic { color: var(--nav-hi); }
.nav .cnt { background: rgba(240, 113, 113, .18); color: #ff9b9b; border-radius: 10px; padding: 0 7px; font-weight: 600; }
.side-foot { border-top: 1px solid rgba(255,255,255,.06); color: var(--nav-muted); }
/* top bar */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.search input { border-radius: 6px; background: var(--surface-2); border-color: var(--line); height: 36px; }
.search input:focus { background: var(--surface); border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { top: 9px; }
.icon-btn { border-radius: 6px; border-color: var(--line); color: var(--ink-2); width: 36px; height: 36px; }
.fy-sel { border-radius: 6px; height: 36px; font-weight: 600; color: var(--ink-2); }
.me { border-radius: 6px; }
.me img { border-radius: 50%; width: 28px; height: 28px; }
/* page header */
.page-head { align-items: center; gap: 14px; padding-bottom: 4px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
.page-head > * { position: relative; }
.ph-ic { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.ph-ic svg { width: 20px; height: 20px; }
.ph-help { font-size: 13px; color: var(--muted); max-width: 80ch; margin-top: 2px; }
/* cards & sections */
.card { border-radius: var(--r-lg); border: 1px solid var(--line); box-shadow: var(--shadow); }
.card-h { padding: 14px 16px 10px; }
.card-h h2, .card-h h3 { display: flex; align-items: center; gap: 8px; font-size: .95rem; }
.sect { border-radius: var(--r-lg); box-shadow: var(--shadow); border-color: var(--line); }
.sect > h3 { color: var(--ink); padding-bottom: 8px; border-bottom: 1px solid var(--line-2); }
.sect > h3 .num-badge { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11.5px; color: var(--accent); background: var(--accent-soft); font-weight: 650; }
.sect .sect-help { font-size: 12.5px; color: var(--muted); margin-top: -4px; }
/* KPI tiles */
.kgroup { display: grid; gap: 8px; }
.kgroup > .eyebrow { padding-left: 2px; }
.kpis { gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.kpi { border-radius: var(--r-lg); padding: 14px 16px 13px; box-shadow: var(--shadow); gap: 3px; transition: border-color .12s, box-shadow .12s; }
.kpi:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 4px 14px rgba(16,24,40,.08); }
.kpi .k-lbl { font-size: 12px; color: var(--muted); font-weight: 550; }
.kpi .k-lbl i { width: 7px; height: 7px; border-radius: 50%; }

  if (!C.isISO(inv.date)) errs.push('Enter the date');
  if (!inv.items || !inv.items.length) errs.push('Add at least one service line');
  (inv.items || []).forEach((it, i) => { if (!it.desc) errs.push('Line ' + (i + 1) + ': add a description'); if (!(it.rate > 0)) errs.push('Line ' + (i + 1) + ': enter the rate'); if (inv.type !== 'opening' && inv.treatment !== 'nongst' && !C.V.sac(it.sac || '')) errs.push('Line ' + (i + 1) + ': SAC should be a 6-digit code starting 99 (e.g. 998221)'); });
  if (inv.totals && inv.totals.total <= 0) errs.push('The total must be more than zero');
  if (inv.instalments && inv.instalments.length) errs.push(...C.validateInstalments(inv.instalments, inv.totals.total));
  if ((inv.type === 'credit') && inv.refInvoiceId) { const ref = Store.get('invoices', inv.refInvoiceId); if (ref && inv.totals.total > ref.totals.total) errs.push('Credit note exceeds the original invoice value'); }
  if (inv.type === 'credit' && inv.refInvoiceId) { const li = D().ledger.inv[inv.refInvoiceId]; if (li && inv.totals.total > li.outstanding && !quiet) { /* allowed: excess becomes client credit */ } }
  if (errs.length) return errs.join(' · ');
  if (inv.type === 'proforma' && inv.status === 'issued') return true;
  const fy = C.fyOf(inv.date); const series = seriesFor(inv.type);
  const seq = C.nextSeq(Store.allIncDeleted('invoices'), series, fy);
  const no = C.formatInvNo(fm.invoicePattern || '{PREFIX}/{FY}/{SEQ4}', series, fy, seq);
  if (!C.V.invoiceNo(no)) return 'Invoice number "' + no + '" breaks the 16-character GST rule. Shorten the prefix or pattern in Administration → Invoice numbering.';
  if (Store.allIncDeleted('invoices').some((x) => x.no === no && x.id !== inv.id)) return 'Number ' + no + ' is already used. Try again.';
  Object.assign(inv, { status: 'issued', series, fy, seq, no, issuedAt: nowISO(), issuedBy: S.uid });
  await Store.save('invoices', inv, 'Issued ' + no + ' ' + money(inv.totals.total) + ' to ' + cName(inv.clientId));
  if (!quiet) toast(INV_TYPES[inv.type] + ' ' + no + ' issued');
  return true;
}

function reminderDraft(inv) {

/* ---------- automatic compliance sync ----------
   Keeps each client's task list in step with its compliance profile and the due-date rules:
   adds missing tasks (due from the 1st of last month to the end of the current FY), restores tasks
   that apply again, updates due dates / verification / extensions on open tasks, and moves untouched
   pending tasks that no longer apply to the recycle bin. Started or filed work is never removed. */
function syncWindow() { const T = today(); const cur = C.fyOf(T); const prev = C.fyOf(C.addMonths(C.fyRange(cur)[0], -1)); return { fys: [prev, cur], from: C.ymd(+T.slice(0, 4), +T.slice(5, 7) - 1, 1), to: C.fyRange(cur)[1] }; }
function planSync(scope) {
  scope = scope || {};
  const clients = scope.clientIds ? scope.clientIds.map((id) => Store.get('clients', id)).filter(Boolean) : D().clients;
  const w = syncWindow();
  return C.planComplianceSync(Store.allIncDeleted('rules'), clients, S.data.tasks, Object.assign(w, { ruleIds: scope.ruleIds ? new Set(scope.ruleIds) : null }));
}
const taskBucket = (t) => (C.fyStartYear(t.dueDate) || '') + '-s' + (C.hash(t.clientId) % ENT.tasks.shards);
async function syncCompliance(scope) {
  scope = scope || {};
  if (S.mode === 'readonly' || !(can('tasks.edit') || can('clients.edit') || can('rules.edit'))) return null;
  if (!Store.all('rules').length) return { create: 0, restore: 0, update: 0, remove: 0, noRules: true };
  const p = planSync(scope);
  const recs = p.create.map((t) => ({ ...t, _b: taskBucket(t), autoSync: true })).concat(p.restore, p.update, p.remove.map((t) => ({ ...t, deletedAt: nowISO(), deletedBy: S.uid })));
  const sum = { create: p.create.length, restore: p.restore.length, update: p.update.length, remove: p.remove.length };
  if (recs.length) {
    try { await Store.saveMany('tasks', recs, 'Compliance sync (' + (scope.why || 'update') + '): +' + (sum.create + sum.restore) + ' tasks, ' + sum.update + ' dates updated, ' + sum.remove + ' removed'); }
    catch (e) { toast('Some compliance tasks could not be updated: ' + (e.message || e), 'bad'); }
  }
  if (!scope.quiet && recs.length) toast(syncMsg(sum));
  return sum;
}
function syncMsg(sum) {
  const parts = []; if (sum.create + sum.restore) parts.push((sum.create + sum.restore) + ' task' + (sum.create + sum.restore > 1 ? 's' : '') + ' added');
  if (sum.update) parts.push(sum.update + ' due date' + (sum.update > 1 ? 's' : '') + ' updated'); if (sum.remove) parts.push(sum.remove + ' no longer applicable (moved to recycle bin)');
  return 'Compliance list updated: ' + parts.join(', ') + '.';
}
/** Why a client gets no automatic tasks — shown after saving. */
function whyNoTasks(c) {
  if (!Store.all('rules').length) return 'No due-date rules yet — install them in Administration → Due-date rules.';
  if (c.status !== 'active') return 'Tasks are created only for clients with status Active.';
  const ticked = CLIENT_FLAGS.filter(([k]) => (c.flags || {})[k]);
  if (!ticked.length) return 'No compliances are ticked for this client.';
  const rules = Store.all('rules').filter((r) => r.active !== false);
  if (!rules.some((r) => C.ruleApplies(r, c))) return 'No active due-date rule matches the ticked compliances' + (c.gstType === 'none' ? ' (GST is set to Not registered)' : '') + '. Check Administration → Due-date rules → “Applies to”.';
  return '';
}

function filteredTasks() {

  const at = t.status === 'na' ? -1 : C.isComplete(t) ? steps.length - 1 : t.status === 'review' ? 2 : ['in_progress', 'rework'].includes(t.status) ? 1 : 0;
  const sub = { awaiting_info: 'Waiting for client', on_hold: 'On hold', rework: 'Rework requested' }[t.status];

/* ===== Security: user ID + password sign-in, encryption at rest (installed app), encrypted backups =====

const Vault = {

}

/* refresh with focus preservation */

function pendingHTML() {

}

/* idle lock (privacy screen; sign-in itself is handled by claude.ai) */

function lockScreen() {

    (vault ? '<input class="inp" id="pinIn" type="password" autocomplete="current-password" style="text-align:center" aria-label="Password">' : pin ? '<input class="inp" id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off" style="max-width:180px;text-align:center;font-size:22px;letter-spacing:6px" aria-label="PIN">' : '') +

/* ---------- global event wiring ---------- */
const FILTER_MAP = { 'data-clf': 'clf', 'data-pf': 'pf', 'data-bf': 'bf', 'data-rf': 'rf', 'data-rv': 'rv', 'data-cf': 'cf', 'data-df': 'df', 'data-sf': 'sf', 'data-dash': 'dash', 'data-rep': 'rep' };

const tqRefresh = debounce((id) => { const sel = '[data-tq="' + id + '"]'; let inDrawer = false; for (const dr of drawers) if (dr.el.querySelector(sel)) { dr.render(); inDrawer = true; } if (!inDrawer || $('#content ' + sel)) refresh(); }, 180);

document.addEventListener('keydown', (e) => {

});
document.addEventListener('change', (e) => {
  const el = e.target;

});
document.addEventListener('dragover', (e) => { const z = e.target.closest('#impDz'); if (z) { e.preventDefault(); z.classList.add('over'); } const k = e.target.closest('[data-drop]'); if (k) { e.preventDefault(); k.classList.add('drop'); } });
document.addEventListener('dragleave', (e) => { const k = e.target.closest('[data-drop]'); if (k) k.classList.remove('drop'); const z = e.target.closest('#impDz'); if (z) z.classList.remove('over'); });

/* ---------- boot ---------- */
async function boot() {

  $('#content').innerHTML = '<div class="card">' + emptyState('refresh', 'Opening your practice…', 'Connecting to secure storage.') + '</div>';

}
